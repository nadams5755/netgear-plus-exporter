[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netgear-plus-exporter"
dynamic = ["version"]
description = "Prometheus exporter for NETGEAR Plus managed switches, using the snmp_exporter-style multi-target /probe pattern."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nick Adams" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
]
keywords = ["netgear", "prometheus", "exporter", "switch"]
dependencies = [
  "py-netgear-plus @ git+https://github.com/nadams5755/py-netgear-plus.git",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.6"]

[project.scripts]
netgear-plus-exporter = "netgear_plus_exporter.__main__:main"

[project.urls]
Homepage = "https://github.com/nadams5755/netgear-plus-exporter"

[tool.hatch.version]
path = "src/netgear_plus_exporter/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/netgear_plus_exporter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto -m \"not integration\""
markers = [
  "integration: requires a live netgear-plus-exporter process and real switches; opt-in only, see 'make test-integration'",
]
